
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Регистрация</title>
  <link rel="stylesheet" href="task1.css">
</head>
<body>
  <form class="reg-form" action="#" method="post">
    <input class="reg-form__input" type="text" name="name" placeholder="Имя" required>
    <input class="reg-form__input" type="email" name="email" placeholder="E-mail" required>
    <input class="reg-form__input" type="tel" name="phone" placeholder="Телефон" required>
    <input class="reg-form__input" type="password" name="password" placeholder="Пароль" required>
    <input class="reg-form__input" type="password" name="password2" placeholder="Пароль еще раз" required>
    <button class="reg-form__button" type="submit">Регистрация</button>
  </form>
</body>
</html>
